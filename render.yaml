services:
  - name: jx3tuanpai-api
    type: web
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAGES_ORIGIN
        value: https://lethelesscam.github.io
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
